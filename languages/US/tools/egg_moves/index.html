<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Move Calculator - PokeMMO Breeder PRO</title>
    
    <link rel="stylesheet" href="../../../../style.css">
    <link rel="icon" href="../../../../assets/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="../../../../manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ESTILOS ESPECÍFICOS DE LA HERRAMIENTA (Contenedor principal) */
        .tool-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Buscador Hero */
        .search-section {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border: 1px solid #333;
        }

        .search-wrapper {
            position: relative;
            max-width: 500px;
            margin: 20px auto 0 auto;
        }

        #pokeSearch {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 25px;
            border: 2px solid #4CAF50;
            background-color: #1a1a1a;
            color: white;
            outline: none;
            box-sizing: border-box;
        }
        
        #pokeSearch:focus {
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.3);
        }

        /* Sugerencias del Buscador */
        #suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #222;
            border: 1px solid #4CAF50;
            border-top: none;
            border-radius: 0 0 15px 15px;
            z-index: 100;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }

        .suggestion-item {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
            transition: background 0.2s;
        }

        .suggestion-item:hover { background-color: #333; }
        .suggestion-item img { width: 40px; height: 40px; }
        .suggestion-text { font-size: 1.1rem; font-weight: bold; }

        /* Panel Pokémon (Info) */
        .pokemon-header {
            display: none; /* Se oculta hasta buscar */
            background: linear-gradient(135deg, #1e1e1e 0%, #252525 100%);
            border: 1px solid #444;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            align-items: center;
            gap: 30px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .pokemon-info h2 { margin: 0 0 10px 0; color: #4CAF50; font-size: 2rem; text-transform: capitalize; }
        
        .type-badge {
            display: inline-block;
            padding: 6px 12px;
            margin-right: 8px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* Grid Movimientos */
        .moves-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .move-card {
            background-color: #222;
            border: 1px solid #3d3d3d;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .move-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border-color: #555;
        }

        .move-card.active {
            border-color: #4CAF50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.3);
            transform: translateY(-5px);
        }

        .move-header {
            padding: 15px 20px;
            background: #2a2a2a;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .move-header:hover { background: #333; }
        .move-name { font-weight: bold; font-size: 1.1rem; color: #eee; }
        
        /* Detalles Padres (Acordeón) */
        .parents-container {
            padding: 0;
            display: none;
            background: #1a1a1a;
        }

        .parents-container.show { display: block; animation: slideDown 0.3s ease-out; }
        
        @keyframes slideDown { from { opacity: 0; max-height: 0; } to { opacity: 1; max-height: 500px; } }

        .parent-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 0.95rem;
            color: #ccc;
        }
        
        .parent-row:hover { background-color: #222; color: white; }
        .parent-row:last-child { border-bottom: none; }

        .method-badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            color: white;
            min-width: 60px;
            text-align: center;
        }
        
        .method-level { background: #1976D2; } /* Azul Level */
        .method-tm { background: #FBC02D; color: #000; } /* Amarillo TM */
        .method-tutor { background: #D32F2F; } /* Rojo Tutor */
        .method-egg { background: #7B1FA2; } /* Violeta Egg */

    </style>
</head>
<body>

    <header style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px 20px; background: rgba(0,0,0,0.5); width: 100%; box-sizing: border-box; height: 80px; border-bottom: 1px solid #333;">
        <div style="display: flex; justify-content: flex-start;">
            <a href="../../index.html" style="text-decoration: none; color: #aaa; font-size: 14px; display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 22px;">⬅</span> <span class="texto-menu">Main Menu</span>
            </a>
        </div>
        <div style="text-align: center; min-width: 200px;">
            <h1 style="margin: 0; font-size: 1.6em; line-height: 1; color: white; white-space: nowrap;">EGG <span style="color: #4CAF50;">MOVES</span></h1>
            <p class="subtitulo" style="margin: 5px 0 0; font-size: 0.8em; color: #ccc;">Breeding Calculator</p>
        </div>
        <div style="display: flex; justify-content: flex-end;">
            <div style="position: relative;">
                <button id="lang-btn" onclick="toggleLangMenu(event)" style="background: #222; color: #ddd; border: 1px solid #555; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px;">
                    <span class="texto-menu">Language</span> 🌐
                </button>
                <div id="lang-dropdown" style="display: none; position: absolute; top: 120%; right: 0; background: #1a1a1a; border: 1px solid #444; border-radius: 6px; min-width: 150px; flex-direction: column; z-index: 9999;">
                    <a href="../../../../tools/egg_moves/index.html" style="padding: 12px; border-bottom: 1px solid #333; color: #bbb; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 13px;">
                        <img src="../../../../assets/spain_flag.svg" style="width: 20px;"> Español
                    </a>
                    <div style="padding: 12px; color: white; display: flex; align-items: center; gap: 8px; font-size: 13px;">
                        <img src="../../../../assets/usa_flag.svg" style="width: 20px;"> English
                    </div>
                </div>
            </div>
        </div>
    </header>
    <style> @media (max-width: 600px) { .texto-menu, .subtitulo { display: none !important; } header h1 { font-size: 1.2em !important; } } </style>

    <div class="tool-container">
        
        <section class="search-section">
            <div style="max-width: 600px; margin: 0 auto;">
                <h2 style="margin-bottom: 20px; color: #ddd;">Find the perfect parent</h2>
                <div class="search-wrapper">
                    <input type="text" id="pokeSearch" placeholder="Type Pokémon name (e.g. Lucario)..." autocomplete="off">
                    <div id="suggestions"></div>
                </div>
            </div>
        </section>

        <div id="pokemonHeader" class="pokemon-header">
            </div>

        <div id="movesContainer">
            <div id="movesGrid" class="moves-grid"></div>
        </div>

    </div>

    <footer style="margin-top: 50px; text-align: center; color: #555; font-size: 11px; padding-bottom: 20px;">
        <p>PokeMMO Breeder PRO © 2026 - Unofficial Tool</p>
    </footer>

    <script src="egg_logic.js"></script>
    
	<script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('../../../../sw.js')
            .then((reg) => console.log('SW Ready ✅', reg.scope))
            .catch((err) => console.log('SW Failed ❌', err));
        });
      }
    </script>
	
	<script>
        // Lógica del menú de idioma (Idéntica a EV Calc)
        function toggleLangMenu(e) { e.stopPropagation(); document.getElementById('lang-dropdown').style.display = document.getElementById('lang-dropdown').style.display === 'flex' ? 'none' : 'flex'; }
        window.onclick = function(e) { if (!document.getElementById('lang-btn').contains(e.target)) document.getElementById('lang-dropdown').style.display = 'none'; }
    </script>

</body>
</html>
